name: Dependency security

on:
  workflow_call:

jobs:
  audit:
    name: Audit (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install audit tooling
        run: uv sync --frozen --dev

      - name: Export release dependency graph
        run: >-
          uv export --quiet --frozen --all-extras --no-dev --no-emit-project
          --output-file requirements-audit.txt

      - name: Audit known vulnerabilities
        run: >-
          uv run pip-audit --strict --require-hashes --disable-pip
          --vulnerability-service pypi -r requirements-audit.txt
