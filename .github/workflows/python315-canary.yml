name: Python 3.15 source canary

on:
  schedule:
    - cron: "41 9 1 * *"
  workflow_dispatch:
    inputs:
      browser-qualification:
        description: Qualify actual report-browser exclusions and all PDF modules
        type: boolean
        default: false
      canonical-migration:
        description: Replay original and composed notebooks from one canonical archive on three OSes
        type: boolean
        default: false
      full-qualification:
        description: Qualify an explicit next-version candidate, including native and installed workflows
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python315-source-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-canary:
    name: Source probe / ${{ matrix.os }} / Python 3.15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.15"
          check-latest: true
          allow-prereleases: false
      - name: Require the actual stable Python 3.15 interpreter
        shell: bash
        run: python -c 'import sys; assert sys.version_info[:2] == (3, 15) and sys.version_info.releaselevel == "final", sys.version; print(sys.executable, sys.version)'
      - name: Extract declared core requirements without changing package support
        shell: bash
        run: |
          uv run --isolated --no-project --python "${{ steps.python.outputs.python-path }}" python -c 'import tomllib; from pathlib import Path; p = tomllib.loads(Path("pyproject.toml").read_text()); Path("python315-core.txt").write_text("\n".join(p["project"]["dependencies"]) + "\n")'
      - name: Record the actual dependency and source-import environment
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          uv run --isolated --no-project --python "${{ steps.python.outputs.python-path }}" --with-requirements python315-core.txt python -c 'import sys,json,importlib.metadata as m; from pathlib import Path; import ml4t.diagnostic as d; p = {"python": sys.version, "source": d.__file__, "version": d.__version__, "packages": {n: m.version(n) for n in ["pyarrow", "numpy", "pandas", "polars", "scipy", "scikit-learn", "statsmodels", "arch", "ml4t-specs"]}, "scope": "Fresh core dependency/source probe, not normal installed-wheel or full-suite qualification. Requires-Python and supported release gates are unchanged."}; Path("python315-environment.json").write_text(json.dumps(p, indent=2) + "\n"); print(json.dumps(p))'
      - name: Exercise public scalar and rolling metrics on the source candidate
        env:
          PYTHONPATH: src
        shell: bash
        run: >-
          uv run --isolated --no-project --python "${{ steps.python.outputs.python-path }}"
          --with-requirements python315-core.txt --with pytest --with pytest-timeout
          python -m pytest --noconftest -o addopts= -q --timeout=120
          tests/test_evaluation/test_constant_sharpe.py
          tests/test_evaluation/test_sharpe_offset_precision.py
          tests/test_evaluation/test_risk_adjusted_correctness.py
          --junitxml=python315-canary.xml
      - name: Retain source-canary evidence even when the probe fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python315-source-${{ matrix.os }}-${{ github.sha }}
          path: |
            python315-core.txt
            python315-environment.json
            python315-canary.xml
          if-no-files-found: warn

  full-qualification:
    name: Full native and installed / ${{ matrix.os }} / Python 3.15
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full-qualification }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      UV_PYTHON: "3.15"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.15"
          check-latest: true
          allow-prereleases: false
      - name: Install OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install the actual supported candidate without overriding Python metadata
        id: environment
        shell: bash
        run: |
          mkdir -p artifacts/python315
          uv sync --frozen --python "${{ steps.python.outputs.python-path }}" --dev --extra ml --extra viz --extra perf 2>&1 | tee artifacts/python315/native-install.log
          uv run --no-sync python -c 'import sys; assert sys.version_info[:2] == (3, 15) and sys.version_info.releaselevel == "final"; print(sys.executable, sys.version)'
          uv run --no-sync python -m playwright install --with-deps chromium
      - name: Build and verify the exact experimental wheel and source archive
        id: artifacts
        shell: bash
        run: |
          uv build --out-dir artifacts/python315/dist
          uv run --no-sync python scripts/verify_release_artifacts.py artifacts/python315/dist --expected-version 0.3.0.dev0
          uv export --frozen --dev --extra ml --extra viz --extra perf --no-emit-project --output-file artifacts/python315/requirements.txt
      - name: Record the actual native interpreter and dependency identity
        shell: bash
        run: |
          uv run --no-sync python - <<'PYTHON'
          import json
          import sys
          import sysconfig
          from importlib.metadata import distributions, metadata, version
          from packaging.specifiers import SpecifierSet
          from platform import python_version
          from pathlib import Path
          import ml4t.diagnostic as diagnostic

          packages = ["polars", "numpy", "pandas", "pyarrow", "scipy", "statsmodels", "numba", "llvmlite", "plotly", "kaleido", "ml4t-specs", "pip-api", "msgpack"]
          identity = {"python": sys.version, "gil_disabled": sysconfig.get_config_var("Py_GIL_DISABLED") or 0, "source": diagnostic.__file__, "version": diagnostic.__version__, "requires_python": metadata("ml4t-diagnostic")["Requires-Python"], "packages": {name: version(name) for name in packages}}
          unsupported = {dist.metadata["Name"]: dist.metadata["Requires-Python"] for dist in distributions() if dist.metadata.get("Requires-Python") and not SpecifierSet(dist.metadata["Requires-Python"]).contains(python_version(), prereleases=True)}
          identity["unsupported_declared_python_bounds"] = unsupported
          Path("artifacts/python315/native-environment.json").write_text(json.dumps(identity, indent=2))
          print(identity)
          assert not unsupported, unsupported
          PYTHON
      - name: Run the full native suite including real PDF ownership and failures
        run: >-
          uv run --no-sync python -m pytest tests/ -q -n 2 --timeout 120
          --junitxml=artifacts/python315/native.xml
      - name: Run the full isolated installed-wheel suite
        if: ${{ !cancelled() && steps.environment.outcome == 'success' && steps.artifacts.outcome == 'success' }}
        shell: bash
        run: |
          wheel=$(find artifacts/python315/dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --python "${{ steps.python.outputs.python-path }}" \
            --with-requirements artifacts/python315/requirements.txt --with "$wheel[ml,viz,perf]" \
            python -I -c "import os,sys,json,platform,pytest; from pathlib import Path; from importlib.metadata import distributions; from packaging.specifiers import SpecifierSet; import ml4t.diagnostic as d; unsupported={dist.metadata['Name']:dist.metadata['Requires-Python'] for dist in distributions() if dist.metadata.get('Requires-Python') and not SpecifierSet(dist.metadata['Requires-Python']).contains(platform.python_version(), prereleases=True)}; Path('artifacts/python315/installed-python-bounds.json').write_text(json.dumps(unsupported,indent=2)); assert not unsupported, unsupported; assert sys.version_info[:2]==(3,15) and d.__version__=='0.3.0.dev0'; assert not Path(d.__file__).resolve().is_relative_to(Path(os.environ['GITHUB_WORKSPACE']).resolve()); print('Installed wheel:', d.__version__, d.__file__, sys.version); raise SystemExit(pytest.main(['tests/', '-q', '-n', '2', '--timeout', '120', '--junitxml=artifacts/python315/installed.xml']))"
      - name: Execute all five originals and PDF controls from both installed formats without Reloaded
        if: ${{ !cancelled() && steps.environment.outcome == 'success' && steps.artifacts.outcome == 'success' }}
        shell: bash
        env:
          ML4T_REQUIRED_PYFOLIO_NOTEBOOKS: "all"
        run: |
          for format in whl tar.gz; do
            artifact=$(find artifacts/python315/dist -name "*.$format" -print -quit)
            uv run --isolated --no-project --python "${{ steps.python.outputs.python-path }}" \
              --with "$artifact[viz,perf]" --with pytest --with pytest-timeout --with nbclient --with ipykernel \
              python -I -c "import os,sys,importlib.util,pytest; from pathlib import Path; import ml4t.diagnostic as d; assert sys.version_info[:2]==(3,15) and d.__version__=='0.3.0.dev0'; assert not Path(d.__file__).resolve().is_relative_to(Path(os.environ['GITHUB_WORKSPACE']).resolve()); assert all(importlib.util.find_spec(n) is None for n in ('pyfolio','empyrical','alphalens','zipline','ml4t.data','ml4t.engineer','ml4t.backtest')); print('Installed format:', '$format', d.__file__); raise SystemExit(pytest.main(['--noconftest', '-o', 'addopts=', '-p', 'no:cacheprovider', '-q', '--timeout', '120', '--junitxml=artifacts/python315/originals-$format.xml', 'tests/test_compat/test_pyfolio_notebook_migration.py', 'tests/test_visualization/test_pdf_process_ownership.py::test_loaded_renderer_document_can_finish_without_a_second_load_event', 'tests/test_visualization/test_pdf_process_ownership.py::test_previous_blank_page_cannot_mark_unloaded_renderer_scripts_as_ready', 'tests/test_visualization/test_pdf_process_ownership.py::test_readiness_timeout_identifies_the_loaded_document_and_missing_plotly', '-k', 'not portable_original_capture_preserves_actual_producer_output']))"
          done
      - name: Exercise the installed all-extra package with actual published producers
        if: ${{ !cancelled() && steps.environment.outcome == 'success' && steps.artifacts.outcome == 'success' }}
        shell: bash
        env:
          ML4T_ACQUISITION_CAPTURE_DIRECTORY: ${{ github.workspace }}/tests/fixtures/acquisition
          ML4T_REQUIRED_ACQUISITION_RECIPE: "1"
        run: |
          wheel=$(find artifacts/python315/dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --python "${{ steps.python.outputs.python-path }}" \
            --with "$wheel[all]" --with 'ml4t-data[yahoo]==0.3.0' --with ml4t-engineer==0.2.0 --with ml4t-backtest==0.2.0 \
            --with pytest --with playwright \
            python -I -c "import sys,json,platform,pytest; from pathlib import Path; from importlib.metadata import metadata; from packaging.specifiers import SpecifierSet; peers=['ml4t-diagnostic','ml4t-data','ml4t-engineer','ml4t-backtest']; bounds={name:metadata(name).get('Requires-Python','') for name in peers}; Path('artifacts/python315/producer-python-bounds.json').write_text(json.dumps(bounds,indent=2)); unsupported={name:value for name,value in bounds.items() if value and not SpecifierSet(value).contains(platform.python_version(),prereleases=True)}; assert not unsupported, unsupported; assert sys.version_info[:2]==(3,15); raise SystemExit(pytest.main(['--noconftest', '-o', 'addopts=', '-p', 'no:cacheprovider', '-q', '--junitxml=artifacts/python315/producers.xml', 'tests/test_integration/test_producer_report_journeys.py', 'tests/test_compat/test_acquisition_recipe.py', '-k', 'not dated_rf_recipe_matches_actual_published_empyrical']))"
      - name: Require the complete native, installed and migration outcomes
        if: ${{ !cancelled() && steps.environment.outcome == 'success' && steps.artifacts.outcome == 'success' }}
        shell: bash
        run: |
          uv run --no-sync python - <<'PYTHON'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("artifacts/python315")
          counts = {}
          expected = {"originals-whl": 17, "originals-tar.gz": 17, "producers": 17}
          for name in ["native", "installed", *expected]:
              cases = list(ET.parse(root / (name + ".xml")).iter("testcase"))
              assert cases, name
              assert not any(case.find(tag) is not None for case in cases for tag in ("failure", "error")), name
              skipped = sum(case.find("skipped") is not None for case in cases)
              if name in expected:
                  assert len(cases) == expected[name] and skipped == 0, name
              counts[name] = {"cases": len(cases), "skipped": skipped}
          (root / "executed-counts.json").write_text(json.dumps(counts, indent=2))
          print(counts)
          PYTHON

      - name: Audit the full declared dependency graph without bypassing hashes
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        shell: bash
        run: |
          uv export --frozen --all-extras --no-dev --no-emit-project --output-file artifacts/python315/requirements-audit.txt
          uv run --no-sync pip-audit --strict --require-hashes --disable-pip --vulnerability-service pypi -r artifacts/python315/requirements-audit.txt
      - name: Retain every actual native and installed outcome and artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python315-full-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/python315/
          if-no-files-found: error


  canonical-artifacts:
    name: Build one immutable Python 3.15 migration candidate
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.canonical-migration || inputs.browser-qualification) }}
    runs-on: ubuntu-latest
    env:
      QUALIFIED_NATIVE_REVISION: f7859c9ea9be5c4028728795c7bc592cc9b79958
      QUALIFIED_WHEEL_SHA256: 1652d2d590b04bd02330759781448bfe7b54168d0cfd3a9569bb2819a901b24b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.9"
      - name: Reuse native qualification only for identical runtime, tests and dependencies
        run: |
          git merge-base --is-ancestor "$QUALIFIED_NATIVE_REVISION" HEAD
          git diff --exit-code "$QUALIFIED_NATIVE_REVISION" HEAD -- src tests scripts pyproject.toml uv.lock
      - run: uv build --out-dir artifacts/canonical
      - name: Verify both canonical artifact metadata envelopes
        run: >-
          uv run --isolated --no-project --with packaging
          python scripts/verify_release_artifacts.py artifacts/canonical
          --expected-version 0.3.0.dev0
      - name: Bind the actual archives to the qualified wheel and Git modules
        run: |
          uv run --isolated --no-project python - <<'PYTHON'
          import hashlib, io, json, os, subprocess, tarfile, zipfile
          from pathlib import Path
          root = Path("artifacts/canonical")
          files = sorted([*root.glob("*.whl"), *root.glob("*.tar.gz")])
          assert len(files) == 2
          wheel = next(p for p in files if p.suffix == ".whl")
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == os.environ["QUALIFIED_WHEEL_SHA256"]
          with tarfile.open(fileobj=io.BytesIO(subprocess.check_output(["git", "archive", "HEAD", "src/ml4t/diagnostic"]))) as archive:
              modules = {p.name.removeprefix("src/"): archive.extractfile(p).read() for p in archive.getmembers() if p.isfile() and p.name.endswith(".py")}
          assert len(modules) == 358
          with zipfile.ZipFile(wheel) as archive:
              assert all(archive.read(name) == value for name, value in modules.items())
          manifest = {"source_revision": os.environ["GITHUB_SHA"], "qualified_native_revision": os.environ["QUALIFIED_NATIVE_REVISION"], "archives": {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, "modules": {name: hashlib.sha256(value).hexdigest() for name, value in modules.items()}}
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2))
          print(manifest["archives"])
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python315-canonical-${{ github.sha }}
          path: artifacts/canonical/
          if-no-files-found: error

  canonical-migration:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.canonical-migration }}
    name: Canonical migration / ${{ matrix.os }} / Python 3.15
    needs: canonical-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      ML4T_REQUIRED_PYFOLIO_NOTEBOOKS: "all"
      ML4T_REQUIRED_ORIGINAL_NOTEBOOKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.9"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.15"
          allow-prereleases: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python315-canonical-${{ github.sha }}
          path: artifacts/canonical/
      - name: Install the browser used by the real PDF controls
        shell: bash
        run: >-
          uv run --isolated --no-project --python "${{ steps.python.outputs.python-path }}"
          --with playwright python -m playwright install --with-deps chromium
      - name: Execute the exact common wheel and source archive without Reloaded
        shell: bash
        run: |
          for format in whl tar.gz; do
            artifact=$(find artifacts/canonical -name "*.$format" -print -quit)
            uv run --isolated --no-project --python "${{ steps.python.outputs.python-path }}" \
              --with "$artifact[viz]" --with pytest --with pytest-timeout --with nbclient --with ipykernel \
              python -I - "$format" <<'PYTHON'
          import hashlib, importlib.util, json, platform, sys, sysconfig
          import xml.etree.ElementTree as ET
          from importlib.metadata import distributions
          from pathlib import Path
          from packaging.specifiers import SpecifierSet
          import ml4t.diagnostic as diagnostic
          import pytest
          assert sys.version_info[:2] == (3, 15) and sys.version_info.releaselevel == "final"
          assert not sysconfig.get_config_var("Py_GIL_DISABLED")
          assert diagnostic.__version__ == "0.3.0.dev0"
          assert not Path(diagnostic.__file__).resolve().is_relative_to(Path.cwd())
          assert all(importlib.util.find_spec(n) is None for n in ("pyfolio", "empyrical", "alphalens", "zipline", "ml4t.data", "ml4t.engineer", "ml4t.backtest"))
          manifest = json.loads(Path("artifacts/canonical/manifest.json").read_text())
          for name, digest in manifest["archives"].items():
              assert hashlib.sha256((Path("artifacts/canonical") / name).read_bytes()).hexdigest() == digest
          package_root = Path(diagnostic.__file__).resolve().parents[2]
          assert all(hashlib.sha256((package_root / name).read_bytes()).hexdigest() == digest for name, digest in manifest["modules"].items())
          unsupported = {d.metadata["Name"]: d.metadata["Requires-Python"] for d in distributions() if d.metadata.get("Requires-Python") and not SpecifierSet(d.metadata["Requires-Python"]).contains(platform.python_version())}
          assert not unsupported, unsupported
          output = Path("artifacts/canonical-replay")
          output.mkdir(parents=True, exist_ok=True)
          report = output / (sys.argv[1] + ".xml")
          (output / (sys.argv[1] + "-identity.json")).write_text(json.dumps({"python": sys.version, "module": diagnostic.__file__, "manifest": manifest, "unsupported": unsupported}, indent=2))
          tests = ["tests/test_compat/test_pyfolio_notebook_migration.py", "tests/test_compat/test_alphalens_original_notebooks.py", "tests/test_signal/test_signal_information_notebook.py", "tests/test_signal/test_signal_turnover_notebook.py", "tests/test_signal/test_signal_event_study_notebook.py", "tests/test_visualization/test_pdf_process_ownership.py::test_loaded_renderer_document_can_finish_without_a_second_load_event", "tests/test_visualization/test_pdf_process_ownership.py::test_previous_blank_page_cannot_mark_unloaded_renderer_scripts_as_ready", "tests/test_visualization/test_pdf_process_ownership.py::test_readiness_timeout_identifies_the_loaded_document_and_missing_plotly"]
          code = pytest.main(["--noconftest", "-c", "/dev/null", "-p", "no:cacheprovider", "-o", "addopts=", "-q", "--timeout", "120", "--basetemp", str(output / sys.argv[1]), "--junitxml", str(report), *tests, "-k", "not portable_original_capture_preserves_actual_producer_output"])
          if code:
              raise SystemExit(code)
          cases = list(ET.parse(report).iter("testcase"))
          assert len(cases) == 25 and not any(c.find(t) is not None for c in cases for t in ("skipped", "failure", "error"))
          print("Canonical artifact:25cases, nine original notebooks, three composed signal notebooks, real PDF controls", sys.argv[1])
          PYTHON
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python315-canonical-replay-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/canonical-replay/
          if-no-files-found: error


  browser-qualification:
    name: Report browser qualification / ${{ matrix.os }} / Python 3.15
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser-qualification }}
    needs: canonical-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.9"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: false
      - name: Install OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install the frozen native qualification environment
        run: uv sync --frozen --python 3.15 --dev --extra ml --extra viz --extra perf
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python315-canonical-${{ github.sha }}
          path: artifacts/canonical/
      - name: Make the real browser discoverable before every report run
        shell: bash
        run: |
          uv run --no-sync playwright install --with-deps chromium
          uv run --no-sync python - <<'PYTHON'
          import hashlib, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runtime:
              executable = Path(runtime.chromium.executable_path)
          assert executable.is_file()
          alias = executable.with_name("google-chrome.exe" if os.name == "nt" else "google-chrome")
          if not alias.exists():
              os.link(executable, alias)
          digest = hashlib.sha256(executable.read_bytes()).hexdigest()
          assert hashlib.sha256(alias.read_bytes()).hexdigest() == digest
          with Path(os.environ["GITHUB_PATH"]).open("a") as stream:
              stream.write(str(alias.parent) + "\n")
          with Path(os.environ["GITHUB_ENV"]).open("a") as stream:
              stream.write("BROWSER_PATH=" + str(alias) + "\n")
              stream.write("ML4T_BROWSER_SHA256=" + digest + "\n")
          PYTHON
      - name: Execute every previously omitted native report case and complete PDF modules
        run: uv run --no-sync python .github/qualification/python315_browser.py native
      - name: Execute the same real report and PDF contracts from both canonical archives
        shell: bash
        run: |
          for format in whl tar.gz; do
            artifact=$(find artifacts/canonical -name "*.$format" -print -quit)
            uv run --isolated --no-project --python 3.15 --with "$artifact[viz]" \
              --with pytest --with pytest-timeout --with playwright --with lxml \
              python -I .github/qualification/python315_browser.py "$format"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python315-browser-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/python315-browser/
          if-no-files-found: error
