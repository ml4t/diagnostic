name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.9"
      - run: uv python install 3.12
      - run: uv sync --frozen --dev --extra docs
      - name: Record documentation identity
        shell: bash
        run: |
          echo "ML4T_DOCS_VERSION=$(uv run python -c 'from ml4t.diagnostic import __version__; print(__version__)')" >> "$GITHUB_ENV"
          echo "ML4T_DOCS_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build and verify documentation
        run: |
          uv run mkdocs build --strict
          uv run --no-project python scripts/verify_documentation_identity.py \
            --site site \
            --expected-library diagnostic \
            --expected-version "$ML4T_DOCS_VERSION" \
            --expected-commit "$ML4T_DOCS_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-${{ github.sha }}
          path: site/
          if-no-files-found: error
