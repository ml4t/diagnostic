name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.9"
      - run: uv python install 3.12
      - run: uv sync --frozen --dev --extra docs
      - name: Record documentation identity
        shell: bash
        run: |
          echo "ML4T_DOCS_VERSION=$(uv run python -c 'from ml4t.diagnostic import __version__; print(__version__)')" >> "$GITHUB_ENV"
          echo "ML4T_DOCS_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build and verify documentation
        run: |
          uv run mkdocs build --strict
          uv run --no-project python scripts/verify_documentation_identity.py \
            --site site \
            --expected-library diagnostic \
            --expected-version "$ML4T_DOCS_VERSION" \
            --expected-commit "$ML4T_DOCS_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-${{ github.sha }}
          path: site/
          if-no-files-found: error

  deploy:
    name: Deploy verified documentation
    runs-on: ubuntu-latest
    needs: build
    environment: documentation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-${{ github.sha }}
          path: site/
      - name: Require the documentation deploy credential
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: test -n "$DOCS_DEPLOY_KEY"
      - name: Deploy the verified documentation artifact
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2 # v1.7.3
        env:
          SSH_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        with:
          source-directory: site/
          destination-github-username: ml4t
          destination-repository-name: website
          target-directory: static/docs/diagnostic/
          target-branch: main
          commit-message: "docs(diagnostic): update from ml4t/diagnostic@${{ github.sha }}"
          user-name: ml4t-bot
          user-email: bot@ml4trading.io
      - name: Verify deployed documentation identity
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' src/ml4t/diagnostic/__init__.py)
          python scripts/verify_documentation_identity.py \
            --url https://www.ml4trading.io/docs/diagnostic/ \
            --expected-library diagnostic \
            --expected-version "$version" \
            --expected-commit "${{ github.sha }}" \
            --attempts 12 \
            --delay 10
