name: Ecosystem qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    permissions:
      contents: read
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@2bfa8eb353b0f16bdaae0506c38b8c44d0819298 # Stable Python 3.15 qualification
    with:
      import-package: ml4t.diagnostic
