name: Ecosystem qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    permissions:
      contents: read
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@322df8513e6f7dceae8eab9d9697b3428ee62af6 # 2026-10-25 bounded 0.2 qualification wait
    with:
      import-package: ml4t.diagnostic
      prerelease-exception: python-315-scipy
