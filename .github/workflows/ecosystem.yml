name: Ecosystem qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    permissions:
      contents: read
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@544ca34d5f3d22f6b6094c093fbfdb460b2387ea # 2026-11-25 Python 3.15 deferral through 2026-12-31
    with:
      import-package: ml4t.diagnostic
      prerelease-exception: python-315-scipy
