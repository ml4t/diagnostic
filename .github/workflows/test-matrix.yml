name: Supported platform tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.9"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install dependencies
        run: uv sync --frozen --dev --extra ml --extra viz
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short -x
      - name: Run all real PDF lifecycle and report tests
        run: >-
          uv run pytest -o addopts=
          tests/test_contract/test_pdf_collection_lifecycle.py
          tests/test_visualization/test_pdf_report_lifecycle.py
          tests/test_visualization/test_pdf_process_ownership.py
          tests/test_visualization/test_report_generation.py
          -q -s -n 0 --timeout 120 --tb=short
