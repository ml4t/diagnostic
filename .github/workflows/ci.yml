name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --dev
      - run: uv run ruff check src/ tests/ scripts/
      - run: uv run ruff format --check src/ tests/ scripts/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --dev
      - run: uv run ty check

  test:
    uses: ./.github/workflows/test-matrix.yml

  windows-pdf-lifecycle:
    name: Windows PDF crash lifecycle
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - run: uv python install 3.13
      - run: uv sync --frozen --dev --extra viz
      - name: Qualify every actual crash-cleanup attempt
        shell: bash
        run: >-
          uv run --no-sync python scripts/check_windows_pdf_lifecycle.py
          --repetitions 12 --output "$RUNNER_TEMP/pdf-crash-lifecycle"
      - name: Retain all crash-cleanup outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-pdf-crash-lifecycle
          path: ${{ runner.temp }}/pdf-crash-lifecycle/
          if-no-files-found: warn

  security:
    uses: ./.github/workflows/security.yml

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4

  docs:
    name: Strict Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --dev --extra docs
      - name: Record documentation identity
        shell: bash
        run: |
          echo "ML4T_DOCS_VERSION=$(uv run python -c 'from ml4t.diagnostic import __version__; print(__version__)')" >> "$GITHUB_ENV"
          echo "ML4T_DOCS_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - run: uv run mkdocs build --strict
      - name: Check pinned book files
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_book_links.py
      - name: Check rendered documentation links
        run: uv run python scripts/check_documentation_links.py --site site --external
      - name: Verify rendered identity
        run: >-
          uv run --no-project python scripts/verify_documentation_identity.py
          --site site
          --expected-library diagnostic
          --expected-version "$ML4T_DOCS_VERSION"
          --expected-commit "$ML4T_DOCS_COMMIT"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --dev --extra ml --extra viz
      - name: Run tests with coverage
        run: >-
          uv run pytest tests/
          --cov=ml4t.diagnostic --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  viz-coverage:
    name: Visualization Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --dev --extra viz
      - name: Run visualization tests with coverage gate
        run: >-
          uv run pytest tests/test_visualization/ -q -n 0
          --cov=src/ml4t/diagnostic/visualization
          --cov-report=term-missing
          --cov-fail-under=45

  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --dev
      - run: uv run pytest tests/test_property/ -v --hypothesis-seed=42 --hypothesis-profile=ci

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --dev
      - name: Run benchmarks
        run: |
          mkdir -p artifacts/benchmarks
          uv run pytest tests/test_benchmarks/ -p no:xdist -o "addopts=" \
            --benchmark-only \
            --benchmark-autosave \
            --benchmark-json artifacts/benchmarks/pytest-benchmark.json
      - name: Generate benchmark report
        run: >-
          uv run python scripts/benchmark_report.py
          --input artifacts/benchmarks/pytest-benchmark.json
          --output artifacts/benchmarks/benchmark-report.md
          --baseline tests/benchmarks/baseline.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: artifacts/benchmarks/

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - security
      - dependency-review
      - codeql
      - docs
      - coverage
      - viz-coverage
      - property-tests
      - benchmarks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --dev
      - run: uv build
      - name: Record package version
        run: echo "PACKAGE_VERSION=$(uv run python -c 'from ml4t.diagnostic import __version__; print(__version__)')" >> "$GITHUB_ENV"
      - name: Check release artifacts
        run: >-
          uv run --isolated --no-project --with packaging
          python scripts/verify_release_artifacts.py dist
          --expected-version "$PACKAGE_VERSION"
      - name: Import installed core wheel without Plotly
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)"
          python -I -c "import importlib.util, runpy;
          assert importlib.util.find_spec('plotly') is None;
          runpy.run_path('scripts/import_smoke.py', run_name='__main__')"
      - name: Run README quick start from installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)"
          python -I scripts/run_readme_quickstart.py
      - name: Run task documentation from installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)[viz]"
          python -I scripts/check_documentation_examples.py
      - name: Run native metric migration workflows from the installed core wheel
        shell: bash
        run: |
          for task in empyrical-native empyrical-benchmark empyrical-definitions empyrical-rolling empyrical-fragility empyrical-tail; do
            uv run --isolated --no-project \
              --with "$(find dist -name '*.whl' -print -quit)" \
              --with "pandas==3.0.5" \
              python -I examples/legacy_migration_comparison.py --task "$task"
          done
      - name: Verify scalar adapters against pinned Empyrical from installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)"
          --with "polars==1.36.1" --with "pandas==2.3.3"
          --with "empyrical-reloaded==0.5.12" --with "pytz==2026.5" --with pytest
          python -I -m pytest --noconftest -c /dev/null -p no:cacheprovider -o addopts=
          -q --tb=short tests/test_compat/test_empyrical_scalar_metrics.py
          tests/test_compat/test_empyrical_return_paths.py
      - name: Verify analytical and rendering adapters against Empyrical with pandas 3
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)[viz]"
          --with "polars==1.36.1" --with "pandas==3.0.5"
          --with "empyrical-reloaded==0.7.0" --with pytest
          python -I -m pytest --noconftest -c /dev/null -p no:cacheprovider -o addopts=
          -q --tb=short tests/test_compat/
          tests/test_metrics/test_gpd_tail_risk.py tests/test_metrics/test_gpd_helper_shapes.py
      - name: Verify published Pyfolio analytical and rendering workflows with compatible pandas
        shell: bash
        run: >-
          ML4T_REQUIRED_PYFOLIO_REFERENCE=0.10.0
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)[viz]"
          --with "polars==1.36.1" --with "pandas==2.3.3"
          --with "empyrical-reloaded==0.7.0" --with "pyfolio-reloaded==0.10.0" --with pytest
          python -I -m pytest --noconftest -c /dev/null -p no:cacheprovider -o addopts=
          -q --tb=short tests/test_compat/
          tests/test_evaluation/test_portfolio_var_definitions.py
          tests/test_metrics/test_gpd_tail_risk.py tests/test_metrics/test_gpd_helper_shapes.py
      - name: Run fitted-tail portfolio report from the installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)[viz]" --with pytest
          python -I -m pytest --noconftest -c /dev/null -p no:cacheprovider -o addopts=
          -q --tb=short tests/test_visualization/test_gpd_tail_report.py
      - name: Run supplied-holdings attribution workflow from installed wheel
        shell: bash
        run: |
          uv run --isolated --no-project \
            --with "$(find dist -name '*.whl' -print -quit)[viz]" \
            --with "pandas==2.3.3" --with "empyrical-reloaded==0.7.0" \
            --with "pyfolio-reloaded==0.10.0" --with pytest --with playwright \
            python -I -m pytest --noconftest -c /dev/null -p no:cacheprovider -o addopts= \
            -q --tb=short tests/test_evaluation/test_holdings_factor_attribution.py \
            tests/test_compat/test_empyrical_holdings_attribution.py \
            tests/test_compat/test_pyfolio_holdings_attribution.py \
            tests/test_compat/test_pyfolio_attribution_plots.py \
            tests/test_compat/test_pyfolio_attribution_sheet.py \
            tests/test_visualization/test_holdings_attribution_report.py \
            tests/test_visualization/test_pyfolio_attribution_browser.py \
            tests/test_visualization/test_report_output_integrity.py
          mkdir -p artifacts/attribution
          uv run --isolated --no-project \
            --with "$(find dist -name '*.whl' -print -quit)[viz]" \
            --with "pandas==2.3.3" --with "empyrical-reloaded==0.7.0" \
            --with "pyfolio-reloaded==0.10.0" \
            python -I examples/holdings_factor_attribution.py --compare --compare-pyfolio \
            --report artifacts/attribution/native.html \
            --pyfolio-report artifacts/attribution/pyfolio.html
      - name: Run FIFO and intraday workflows from installed wheel
        shell: bash
        run: |
          uv run --isolated --no-project \
            --with "$(find dist -name '*.whl' -print -quit)[viz]" \
            --with "pandas==2.3.3" --with "empyrical-reloaded==0.7.0" \
            --with "pyfolio-reloaded==0.10.0" --with pytest --with playwright \
            python -I -m pytest --noconftest -c /dev/null -p no:cacheprovider -o addopts= \
            -q --tb=short tests/test_evaluation/test_portfolio_fifo.py \
            tests/test_evaluation/test_intraday_estimate.py \
            tests/test_compat/test_pyfolio_round_trips.py \
            tests/test_compat/test_pyfolio_round_trip_helpers.py \
            tests/test_compat/test_pyfolio_closing_transactions.py \
            tests/test_compat/test_pyfolio_round_trip_report.py \
            tests/test_visualization/test_round_trip_dashboard.py \
            tests/test_visualization/test_intraday_clock_export.py
          mkdir -p artifacts/fifo
          uv run --isolated --no-project \
            --with "$(find dist -name '*.whl' -print -quit)[viz]" \
            python -I examples/portfolio_fifo.py \
            --familiar-report artifacts/fifo/familiar.html
          uv run --isolated --no-project \
            --with "$(find dist -name '*.whl' -print -quit)[viz]" \
            python -I examples/portfolio_intraday.py --estimate \
            --report artifacts/fifo/estimated-intraday.html
      - name: Run complete capacity workflows from installed wheel
        shell: bash
        run: |
          uv run --isolated --no-project \
            --with "$(find dist -name '*.whl' -print -quit)[viz]" \
            --with "pandas==2.3.3" --with "empyrical-reloaded==0.7.0" \
            --with "pyfolio-reloaded==0.10.0" --with pytest --with playwright \
            python -I -m pytest --noconftest -c /dev/null -p no:cacheprovider -o addopts= \
            -q --tb=short tests/test_evaluation/test_portfolio_capacity.py \
            tests/test_compat/test_pyfolio_capacity.py tests/test_compat/test_pyfolio_capacity_sheet.py \
            tests/test_visualization/test_capacity_report.py
          mkdir -p artifacts/capacity
          uv run --isolated --no-project \
            --with "$(find dist -name '*.whl' -print -quit)[viz]" \
            --with "pandas==2.3.3" --with "empyrical-reloaded==0.7.0" \
            --with "pyfolio-reloaded==0.10.0" \
            python -I examples/portfolio_capacity.py --compare \
            --output artifacts/capacity/native.html \
            --familiar-report artifacts/capacity/familiar.html
          uv run --isolated --no-project \
            --with "$(find dist -name '*.whl' -print -quit)[viz]" \
            --with "ml4t-data==0.2.1" --with pytest \
            python -I -m pytest --noconftest -c /dev/null -p no:cacheprovider -o addopts= \
            -q --tb=short tests/test_integration/test_capacity_data_provider.py
          uv run --isolated --no-project \
            --with "$(find dist -name '*.whl' -print -quit)[viz]" \
            --with "ml4t-backtest @ git+https://github.com/ml4t/backtest@da223f904cfa03744152311e3c617c15fdc1ddcd" \
            --with pytest \
            python -I -m pytest --noconftest -c /dev/null -p no:cacheprovider -o addopts= \
            -q --tb=short tests/test_integration/test_capacity_backtest.py
      - name: Run complete stress live and cone workflows from installed wheel
        shell: bash
        run: |
          uv run --isolated --no-project \
            --with "$(find dist -name '*.whl' -print -quit)[viz]" \
            --with "pandas==2.3.3" --with "empyrical-reloaded==0.7.0" \
            --with "pyfolio-reloaded==0.10.0" --with pytest --with playwright \
            python -I -m pytest --noconftest -c /dev/null -p no:cacheprovider -o addopts= \
            -q --tb=short tests/test_evaluation/test_portfolio_stress_live.py \
            tests/test_evaluation/test_portfolio_wealth_cones.py \
            tests/test_compat/test_pyfolio_wealth_cones.py \
            tests/test_compat/test_pyfolio_cone_plotting.py \
            tests/test_compat/test_pyfolio_stress_sheet.py \
            tests/test_compat/test_pyfolio_performance.py \
            tests/test_compat/test_pyfolio_positions.py \
            tests/test_compat/test_pyfolio_position_report.py \
            tests/test_visualization/test_pyfolio_positions_browser.py \
            tests/test_compat/test_pyfolio_return_plotting.py \
            tests/test_compat/test_pyfolio_returns_report.py \
            tests/test_visualization/test_pyfolio_returns_browser.py \
            tests/test_visualization/test_portfolio_regime_report.py
          mkdir -p artifacts/regimes
          uv run --isolated --no-project \
            --with "$(find dist -name '*.whl' -print -quit)[viz]" \
            python -I examples/pyfolio_returns_report.py --bootstrap \
            --output artifacts/regimes/returns.html
          uv run --isolated --no-project \
            --with "$(find dist -name '*.whl' -print -quit)[viz]" \
            --with "pandas==2.3.3" --with "empyrical-reloaded==0.7.0" \
            --with "pyfolio-reloaded==0.10.0" \
            python -I examples/portfolio_regimes.py --task all --compare-pyfolio \
            --output artifacts/regimes/native.html \
            --familiar-output artifacts/regimes/familiar.html
      - name: Run prepared holdings with minimum Polars from installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)"
          --with "polars==1.36.1" --with "pandas==2.3.3"
          python -I examples/legacy_migration_comparison.py --task holdings
      - name: Run prepared portfolio report at dependency floors from installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)"
          --with "polars==1.36.1" --with "pandas==2.3.3" --with "plotly==5.15.0"
          python -I examples/legacy_migration_comparison.py --task holdings-report
          --output "$RUNNER_TEMP/prepared-holdings.html"
      - name: Run signal workflows with minimum Polars from installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)[viz]"
          --with "polars==1.36.1" --with "pandas==2.3.3"
          --with pytest --with pytest-timeout --with pytest-xdist
          --with "alphalens-reloaded==0.4.6" --with playwright
          pytest --noconftest -c /dev/null -p no:cacheprovider -o addopts=
          -q -n auto --timeout 120 tests/test_signal/
      - name: Run Alphalens preparation adapters from installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)[viz]"
          --with "polars==1.36.1" --with "pandas==2.3.3"
          --with "alphalens-reloaded==0.5.0" --with "empyrical-reloaded==0.7.0"
          --with pytest
          python -I -m pytest --noconftest -c /dev/null -p no:cacheprovider -o addopts=
          -q tests/test_compat/test_alphalens_preparation.py
          tests/test_compat/test_alphalens_time_alignment.py
          tests/test_compat/test_alphalens_bucketing.py
          tests/test_compat/test_alphalens_portfolio.py
          tests/test_signal/test_signal_portfolio_interchange.py
          tests/test_signal/test_signal_outcome_ingestion.py
          tests/test_signal/test_signal_price_preparation.py
      - name: Run aligned event migration from installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)[viz]"
          --with "polars==1.36.1" --with "pandas==2.3.3" --with "plotly==6.1.2"
          python -I examples/legacy_migration_comparison.py --task events
          --output "$RUNNER_TEMP/aligned-events.html"
      - name: Execute prepared portfolio report in a notebook from installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)[viz]"
          --with nbclient --with ipykernel --with pytest
          pytest --noconftest -c /dev/null -p no:cacheprovider -q -s
          tests/test_evaluation/test_portfolio_notebook_report.py
      - name: Run complete event-returns workflow from installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)[viz]"
          --with "polars==1.36.1" --with "pandas==2.3.3" --with "plotly==6.1.2"
          python -I examples/legacy_migration_comparison.py --task event-returns
          --output "$RUNNER_TEMP/event-returns.html"
      - name: Execute complete event-returns notebook from installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
          --with "$(find dist -name '*.whl' -print -quit)[viz]"
          --with nbclient --with ipykernel --with pytest
          pytest --noconftest -c /dev/null -p no:cacheprovider -q -s
          tests/test_signal/test_event_returns_notebook.py
      - name: Retain aligned event report browser evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-report-browser
          path: artifacts/event-reports/
          if-no-files-found: error
      - name: Run all real PDF tests from installed wheel
        shell: bash
        run: >-
          uv run --isolated --no-project
