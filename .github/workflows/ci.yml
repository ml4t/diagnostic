name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run ty check
        run: uv run ty check

  test:
    uses: ./.github/workflows/test-matrix.yml

  security:
    uses: ./.github/workflows/security.yml

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --dev --extra ml --extra viz

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            --cov=ml4t.diagnostic --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  viz-coverage:
    name: Visualization Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --dev --extra viz

      - name: Run visualization tests with coverage gate
        run: |
          uv run pytest tests/test_visualization/ -q -n 0 \
            --cov=src/ml4t/diagnostic/visualization \
            --cov-report=term-missing \
            --cov-fail-under=45

  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run property-based tests
        run: uv run pytest tests/test_property/ -v --hypothesis-seed=42 --hypothesis-profile=ci

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run benchmarks
        run: |
          mkdir -p artifacts/benchmarks
          uv run pytest tests/test_benchmarks/ -p no:xdist -o "addopts=" \
            --benchmark-only \
            --benchmark-autosave \
            --benchmark-json artifacts/benchmarks/pytest-benchmark.json

      - name: Generate benchmark report
        run: |
          uv run python scripts/benchmark_report.py \
            --input artifacts/benchmarks/pytest-benchmark.json \
            --output artifacts/benchmarks/benchmark-report.md \
            --baseline tests/benchmarks/baseline.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-results
          path: artifacts/benchmarks/

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security, coverage, viz-coverage, property-tests]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.9"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Build package
        run: uv build

      - name: Check release artifacts
        run: uv run --isolated --no-project python scripts/verify_release_artifacts.py dist

      - name: Import installed wheel
        shell: bash
        run: uv run --isolated --no-project --with "$(find dist -name '*.whl' -print -quit)" python scripts/import_smoke.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
