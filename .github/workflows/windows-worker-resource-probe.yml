name: Windows worker-dependent exit probe

on:
  push:
    branches: [fix/pdf-job-terminal-order]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-worker-probe:
    name: Real worker-owned exit / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --dev --extra viz
      - name: Prepare owned probe artifact directory
        run: uv run --no-sync python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"
      - name: Exercise actual live-worker ownership and native exit signals
        run: >-
          uv run --no-sync python -m pytest
          tests/test_visualization/test_pdf_process_ownership.py
          -k worker_owned -o addopts= -vv -rA --timeout 120
          --junitxml=artifacts/windows-worker-resource.xml
          --basetemp=artifacts/windows-worker-resource
      - name: Retain every actual regression outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-worker-resource-${{ matrix.python }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
